name: Verificar Filosofle
on:
  push:
    paths:
      - index.html
      - PALAVRAS.md
      - .github/workflows/verificar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir scripts e banco
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          assert(scripts.length>=2,'É necessário encontrar os scripts do jogo.');
          for(const script of scripts)new vm.Script(script);
          const ctx={};
          vm.runInNewContext(scripts[0]+';globalThis.RESULT=CONCEPTS.map(c=>({word:c.word,topic:c.topic,level:c.level}));',ctx);
          const words=ctx.RESULT;
          assert.equal(words.length,86,'Quantidade de palavras revisadas diferente do esperado.');
          for(const excluded of ['Estética','Linguagem','Existência','Tecnologia','Ciência','Religião'])assert(!words.some(w=>w.topic===excluded),'Área que deveria ter sido removida: '+excluded);
          const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
          const set=new Set(words.map(x=>norm(x.word)));
          assert.equal(set.size,words.length,'Existem palavras duplicadas.');
          for(const removed of ['ÁGUA','TEATRO','RESÍDUO','ROBÔ','MÚSICA','CINEMA','AMOSTRA','DADOS','NEGAÇÃO'])assert(!set.has(norm(removed)), 'Resposta inadequada: '+removed);
          for(const w of words)assert(norm(w.word).length>=1&&norm(w.word).length<=10,'Palavra com tamanho inválido: '+w.word);
          assert(!html.includes('data-tab="challenges"'),'A aba Desafios não deveria aparecer.');
          assert(!html.includes('id="journeyChallenge"'),'A trilha foi mantida indevidamente.');
          assert(!html.includes('id="dailyFromHome"'),'Desafio diário ainda aparece na página inicial.');
          assert(html.includes('id="noHintsFromHome"'),'Botão Sem pistas ausente.');
          assert(html.includes('const stats=activeStatistics(store.studied)'),'Estatísticas não estão restritas às respostas atuais.');
          assert(html.includes('data-collection-filter="lost"'),'A coleção precisa separar derrotas e descobertas.');
          assert(!html.includes('data-collection-filter="favorite"'),'Favoritas não deveria existir na coleção.');
          assert(!html.includes("fav.addEventListener"),'Botão de favoritos não deveria existir.');
          assert(!html.includes('<span>Descobertas</span>'),'A página inicial ainda exibe Descobertas.');
          assert(html.includes("displayWord(a.word).localeCompare(displayWord(b.word),'pt-BR'"),'Coleção não está em ordem alfabética.');
          assert(html.includes('id="discoverySimple"'),'Introdução simples não aparece na tela de estudos.');

          assert(html.includes('current-86-v3'),'A correção de vitórias atuais está ausente.');
          assert(!html.includes('id="collectionSearch"'),'O campo de busca na coleção deveria ter sido removido.');
          const statStart=scripts[1].indexOf('const activeStatistics=');
          const statEnd=scripts[1].indexOf('const defaults=()=>',statStart);
          assert(statStart>=0&&statEnd>statStart,'Cálculo das estatísticas não encontrado.');
          const statCtx=vm.createContext({CONCEPTS:words,normalize:norm});
          vm.runInContext(scripts[1].slice(statStart,statEnd)+';globalThis.stats=activeStatistics;',statCtx);
          const sample={ETICA:{plays:2,wins:2,won:true},VIRTUDE:{plays:2,wins:2,won:true},MORAL:{plays:1,wins:1,won:true},ARGUMENTO:{plays:1,wins:0,won:false},PARADIGMA:{plays:3,wins:2,won:true}};
          const example=statCtx.stats(sample);
          assert.equal(example.played,4,'Partidas incluem vitórias duplicadas ou palavras excluídas.');
          assert.equal(example.wins,3,'Vitórias não correspondem às palavras descobertas.');
          assert.equal(example.losses,1,'Derrotas não batem com as partidas.');
          assert.equal(example.played,example.wins+example.losses,'Partidas precisam fechar com vitórias e derrotas.');
          const migrationStart=scripts[1].indexOf('const STORE_KEY='),migrationEnd=scripts[1].indexOf('let store=loadStore();',migrationStart);
          assert(migrationStart>=0&&migrationEnd>migrationStart,'Migração do histórico não encontrada.');
          function validateMigration(raw){
            const context=vm.createContext({CONCEPTS:words,WORD_BY_KEY:new Map(words.map(c=>[norm(c.word),c])),normalize:norm,localStorage:{getItem:()=>JSON.stringify(raw)}});
            vm.runInContext(scripts[1].slice(migrationStart,migrationEnd)+';globalThis.saved=loadStore();',context);
            return JSON.parse(JSON.stringify(context.saved));
          }
          const migrated=validateMigration({played:6,wins:5,studied:sample,solvedWords:['ETICA','VIRTUDE','MORAL','PARADIGMA']});
          assert.equal(migrated.played,4,'Partidas armazenadas não foram descontadas.');
          assert.equal(migrated.wins,3,'Vitórias armazenadas não foram corrigidas.');
          assert.equal(migrated.studied.ETICA.wins,1,'Vitórias duplicadas permanecem no histórico da palavra.');
          assert(!migrated.studied.PARADIGMA,'Palavras excluídas permanecem no registro.');
          const repeated=validateMigration(migrated);
          assert.equal(repeated.played,4,'Atualizações repetidas alteraram o número de partidas.');
          assert.equal(repeated.wins,3,'Atualizações repetidas alteraram as vitórias.');
          assert(html.includes('activeStatistics(store.studied)'),'O contador por palavras atuais está ausente.');
          const detailCtx=vm.createContext({});
          vm.runInContext(scripts[0],detailCtx);
          for(const topic of ['etica','conhecimento','logica','politica','metafisica','tradicoes']){
            const path='conteudos/'+topic+'.js';
            assert(fs.existsSync(path),'Aprofundamento ausente: '+path);
            vm.runInContext(fs.readFileSync(path,'utf8'),detailCtx);
          }
          vm.runInContext(';globalThis.DEEPS=CONCEPTS.map(c=>({word:c.word,parts:[c.deepOrigin,c.deepConnection,c.deepDebate],simple:c.simpleGuide}));',detailCtx);
          assert.equal(detailCtx.DEEPS.length,86);
          for(const c of detailCtx.DEEPS)for(const part of c.parts)assert(typeof part==='string'&&part.length>=110,'Aprofundamento insuficiente: '+c.word);
          for(const c of detailCtx.DEEPS)assert(typeof c.simple==='string'&&c.simple.length>=240,'Introdução simples ausente ou curta: '+c.word);
          const accident=detailCtx.DEEPS.find(c=>c.word==='ACIDENTE');
          assert(accident&&accident.simple.includes('arché')&&accident.simple.includes('Anaximandro'),'Acidente não explica a arché pré-socrática.');

          const topics=[...new Set(words.map(w=>w.topic))];
          assert.equal(topics.length,6,'O jogo deve conter seis áreas após a curadoria.');
          for(const topic of topics)assert(words.filter(w=>w.topic===topic).length>=10,'Área com menos de 10 conceitos: '+topic);
          for(const topic of topics)for(let n=1;n<=4;n++)assert(words.some(x=>x.topic===topic&&x.level===n),'Nível sem palavra em '+topic+': '+n);
          const ss=scripts[1].indexOf('const DICTIONARY_SOURCES='),se=scripts[1].indexOf('const DICTIONARY_CACHE=',ss);
          assert(ss>=0&&se>ss,'Fontes de dicionários não encontradas.');
          const sources=vm.runInNewContext(scripts[1].slice(ss,se)+';DICTIONARY_SOURCES;');
          assert.equal(sources.length,3,'Devem existir exatamente três dicionários independentes.');
          assert.equal(new Set(sources.map(x=>x.id)).size,3,'Os dicionários precisam ter identificadores distintos.');
          assert.equal(sources.reduce((n,x)=>n+x.parts.length,0),4,'O léxico e as conjugações devem ser arquivos complementares.');
          for(const source of sources)for(const part of source.parts){
            assert.equal(part.mirrors.length,2,'Cada base precisa de duas opções de download.');
            assert(part.minWords>1000,'A verificação precisa rejeitar uma base incompleta.');
          }
          assert(sources.some(x=>x.id==='palavras'),'Fonte Palavras PT-BR ausente.');
          assert(sources.some(x=>x.id==='fserb'&&x.parts.some(p=>p.id.includes('conjugacoes'))),'Conjugações verbais ausentes.');
          assert(sources.some(x=>x.id==='gelocci'&&x.parts.some(p=>p.format==='tsv')),'Dicionário de corpus ausente.');
          for(const w of ['AÇÕES','PENSANDO','FALARAM','VIRTUDES']){ if(w==='FALARAM')continue;assert(html.includes(w),'Forma ausente: '+w); }
          assert(!scripts[1].includes('selectTile('),'Seleção de quadrados ainda ativa.');
          assert(html.includes('pointer-events:none;user-select:none;cursor:default'),'O CSS ainda permite interagir com quadrados.');
          assert(html.includes('filosofle-build'),'Identificador de versão ausente.');
          assert(!scripts[1].includes("tile.addEventListener('click'"),'Quadrados ainda clicáveis.');
          assert(!html.includes('Toque em qualquer quadrado da tentativa atual'),'Ajuda antiga de seleção ainda presente.');
          const context=vm.createContext({round:{typed:'     ',item:{word:'TESTE'}},lengthOf:()=>5,renderBoard:()=>{},saveDailyProgress:()=>{}});
          const start=scripts[1].indexOf('function appendLetter('),end=scripts[1].indexOf('function revealTiles(',start);
          assert(start>=0&&end>start,'As funções de digitação sequencial não foram encontradas.');
          vm.runInContext(scripts[1].slice(start,end),context);
          for(const ch of 'ABCDE')context.appendLetter(ch);
          assert.equal(context.round.typed,'ABCDE','A escrita não seguiu da esquerda para a direita.');
          context.appendLetter('X');
          assert.equal(context.round.typed,'ABCDE','A escrita ultrapassou o último quadrado.');
          context.eraseLastLetter();
          assert.equal(context.round.typed,'ABCD ','O Backspace não apagou a última letra.');
          context.appendLetter('F');
          assert.equal(context.round.typed,'ABCDF','A escrita não retomou a última posição.');
          const dictCtx=vm.createContext({});
          const ns=scripts[1].indexOf('const normalize='),ne=scripts[1].indexOf('const displayWord=',ns);
          assert(ns>=0&&ne>ns,'Normalizador não encontrado.');
          vm.runInContext(scripts[1].slice(ns,ne)+';globalThis.normalizer=normalize;',dictCtx);
          vm.runInContext(scripts[0],dictCtx);
          const ds=scripts[1].indexOf('const COMMON_INFLECTIONS='),de=scripts[1].indexOf("let dictionaryState=",ds),gs=scripts[1].indexOf('function guessIsValid('),ge=scripts[1].indexOf('function checkGuessDictionary(',gs);
          assert(ds>=0&&de>ds&&gs>=0&&ge>gs,'Validador de palavras ausente.');
          vm.runInContext(scripts[1].slice(ds,de)+scripts[1].slice(gs,ge)+';globalThis.checkWord=guessIsValid;',dictCtx);
          // Paradigma é aceito depois de ser carregado dos dicionários, sem voltar a ser resposta do jogo.
          assert(!dictCtx.checkWord('PARADIGMA'),'Paradigma não deve ser resposta pré-carregada.');
          vm.runInContext("VALID_GUESSES.add('PARADIGMA');",dictCtx);
          for(const w of ['PARADIGMA','PARADIGMAS','VIRTUDES','HIPOTESES','NARRATIVAS','PENSANDO','AÇÕES','ASSASSINO','ASSASSINA'])assert(dictCtx.checkWord(w),'Forma legítima recusada: '+w);
          for(const w of ['XPTOZZ','PARADIGMZZ','PQZXWR']){
            console.log('VERIFICAÇÃO NEGATIVA',w,'normalização',dictCtx.normalizer(w),'aceita',dictCtx.checkWord(w));
            assert(!dictCtx.checkWord(w),'Palavra inventada aceita: '+w);
          }
          const testEnv=vm.createContext({VALID_GUESSES:new Set(),setTimeout});
          vm.runInContext(scripts[1].slice(ns,ne),testEnv);
          const ps=scripts[1].indexOf('async function parseDictionaryPart('),pe=scripts[1].indexOf('async function loadDictionaryPart(',ps);
          assert(ps>=0&&pe>ps,'Leitor de dicionários ausente.');
          vm.runInContext(scripts[1].slice(ps,pe)+';globalThis.readDictionary=parseDictionaryPart;',testEnv);
          Promise.all([
            testEnv.readDictionary('PARADIGMA\nFLOR\n',{format:'lines'}),
            testEnv.readDictionary('ANDARAM\nESTUDANDO\n',{format:'lines'}),
            testEnv.readDictionary('flores\t250\tcorreto\nestrangeirismo\t100\taceitavel\n',{format:'tsv'})
          ]).then(()=>{
            for(const term of ['PARADIGMA','FLOR','ANDARAM','ESTUDANDO','FLORES'])assert(testEnv.VALID_GUESSES.has(term),'Palavra válida ausente após leitura: '+term);
            assert(!testEnv.VALID_GUESSES.has('ESTRANGEIRISMO'),'A fonte TSV deve excluir entradas não classificadas como corretas.');
            console.log('OK: três dicionários, corpus TSV, conjugações, plurais, digitação sequencial e 86 respostas.');
          }).catch(error=>{console.error(error);process.exitCode=1;});
          NODE
